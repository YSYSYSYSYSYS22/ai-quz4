<!--
GitHub Pages용 Supabase 실시간 공동 순위표.
필수: Supabase Dashboard > Authentication > Providers > Anonymous Sign-ins 활성화.
Supabase 프로젝트: ai-school-quiz / quiz_leaderboard.
기존 QR코드를 유지하려면 GitHub Pages의 기존 HTML 파일명/경로로 업로드하세요.
학생 ID는 화면에서만 입력하며 데이터베이스에는 저장하지 않습니다.
주의: 학생이 직접 계산한 점수이므로 조작 방지는 서버 검증이 별도로 필요합니다.
-->

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI중점고 점심시간 스피드 AI 상식 퀴즈</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3B82F6;
            --primary-dark: #1D4ED8;
            --bg-color: #EEF2FF;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-sub: #334155;
            --correct-color: #059669;
            --correct-bg: #D1FAE5;
            --wrong-color: #DC2626;
            --wrong-bg: #FEE2E2;
        }

        * {
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#C7D2FE 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .quiz-card {
            background-color: var(--card-bg);
            border-radius: 28px;
            width: 100%;
            max-width: 720px;
            padding: 32px;
            box-shadow: 0 20px 30px -10px rgba(79, 70, 229, 0.15), 0 10px 15px -5px rgba(0, 0, 0, 0.04);
            border: 3px solid #C7D2FE;
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* Mascot UI */
        .mascot-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #F1F5F9;
            border-radius: 20px;
            padding: 12px 20px;
            margin-bottom: 20px;
            border: 2px solid #E2E8F0;
        }

        .mascot-avatar {
            font-size: 2.2rem;
            animation: pulse 2s infinite ease-in-out;
        }

        .mascot-speech {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--primary-dark);
        }

        /* Combo Badge UI */
        .combo-badge {
            display: none;
            position: absolute;
            top: -18px;
            right: 36px;
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 1.05rem;
            font-weight: 900;
            box-shadow: 0 4px 14px rgba(234, 88, 12, 0.4);
            animation: bounceIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 10;
        }

        /* Options List */
        .options-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-button {
            background-color: #F8FAFC;
            color: var(--text-main);
            border: 2px solid #CBD5E1;
            padding: 16px 22px;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-button:hover:not(:disabled) {
            background-color: #EEF2FF;
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }

        .option-button.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-color) !important;
            color: #065F46 !important;
            font-weight: 800;
        }

        .option-button.wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-color) !important;
            color: #991B1B !important;
            font-weight: 800;
        }

        /* Animations */
        .shake-animation {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
            border-color: var(--wrong-color) !important;
        }

        .correct-animation {
            animation: bounce 0.4s ease;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(6px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        @keyframes bounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* Custom Scrollbar */
        .ranking-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .ranking-scroll::-webkit-scrollbar-thumb {
            background-color: #CBD5E1;
            border-radius: 4px;
        }

        @media (max-width: 640px) {
            .quiz-card {
                padding: 22px 18px;
                border-radius: 20px;
            }
            .combo-badge {
                right: 18px;
                font-size: 0.88rem;
                padding: 6px 14px;
            }
        }
    </style>
</head>
<body>

<script type="module">
    // Supabase Dashboard > Authentication > Providers > Anonymous Sign-ins 를 활성화하세요.
    // GitHub Pages의 기존 HTML 파일명과 경로를 유지하면 QR코드는 그대로 사용 가능합니다.
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.75.0";
    const supabase = createClient(
        "https://hgfsgeeppaywanjegglj.supabase.co",
        "sb_publishable_EHs4d1xTTAOyVpK5ggyuwA_UE-hL5Sg"
    );
    const statusMessage = document.getElementById('cloud-status');
    const setStatus = (message, error = false) => {
        if (!statusMessage) return;
        statusMessage.textContent = message;
        statusMessage.className = `text-center text-sm font-bold mb-3 ${error ? 'text-red-600' : 'text-blue-700'}`;
        statusMessage.classList.remove('hidden');
    };
    let realtimeChannel = null;
    const authReady = (async () => {
        const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
        if (sessionError) throw sessionError;
        if (sessionData.session?.user) return sessionData.session.user;
        const { data, error } = await supabase.auth.signInAnonymously();
        if (error) throw error;
        return data.user;
    })().catch(error => {
        console.error('Supabase anonymous login failed:', error);
        setStatus('Supabase 익명 로그인이 필요합니다. Authentication > Providers에서 Anonymous Sign-ins를 켜주세요.', true);
        return null;
    });
    window.saveScoreToCloud = async (_studentId, nickname, score) => {
        const user = await authReady;
        if (!user) throw new Error('Supabase 익명 로그인 실패');
        const { data: existing, error: readError } = await supabase.from('quiz_leaderboard')
            .select('score').eq('user_id', user.id).maybeSingle();
        if (readError) throw readError;
        if (existing && existing.score >= score) return;
        const { error } = await supabase.from('quiz_leaderboard').upsert({
            user_id: user.id, nickname: String(nickname).trim().slice(0,20), score,
            updated_at: new Date().toISOString()
        }, { onConflict: 'user_id' });
        if (error) throw error;
    };
    window.watchLeaderboard = async (onRecords, onError) => {
        const user = await authReady;
        if (!user) { onError('Supabase 익명 로그인 설정을 확인해주세요.'); return; }
        if (realtimeChannel) { await supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
        const fetchScores = async () => {
            const { data, error } = await supabase.from('quiz_leaderboard')
                .select('nickname,score,updated_at').order('score',{ascending:false})
                .order('updated_at',{ascending:true}).limit(1000);
            if (error) { console.error(error); onError('순위표를 불러오지 못했습니다: ' + error.message); return; }
            onRecords(data || []);
        };
        await fetchScores();
        realtimeChannel = supabase.channel('school-quiz-live-' + Math.random().toString(36).slice(2))
            .on('postgres_changes', {event:'*',schema:'public',table:'quiz_leaderboard'}, fetchScores)
            .subscribe(status => { if (status === 'CHANNEL_ERROR') onError('실시간 연결 오류: 페이지를 새로고침해 주세요.'); });
    };
    window.stopLeaderboardWatch = () => {
        if (realtimeChannel) supabase.removeChannel(realtimeChannel);
        realtimeChannel = null;
    };
</script>

<script>
    let audioCtx = null;

    function playSound(type) {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'combo') {
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        } catch (e) {
            console.log("Audio playback not allowed yet", e);
        }
    }

    let currentIdx = 0;
    let score = 0;
    let combo = 0;
    let answered = false;
    let studentId = "";
    let studentNickname = "";

    // DOM Elements
    const startScreen = document.getElementById('start-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const mainCard = document.getElementById('main-card');

    const badge = document.getElementById('badge');
    const scoreDisplay = document.getElementById('score-display');
    const progressBar = document.getElementById('progress-bar');
    const questionTitle = document.getElementById('question-title');
    const optionsList = document.getElementById('options-list');
    const explanationCard = document.getElementById('explanation-card');
    const explanationBody = document.getElementById('explanation-body');
    const nextBtn = document.getElementById('next-btn');
    const comboBadge = document.getElementById('combo-badge');
    const mascotAvatar = document.getElementById('mascot-avatar');
    const mascotSpeech = document.getElementById('mascot-speech');

    function handleStartQuiz(e) {
        e.preventDefault();
        studentId = document.getElementById('student-id').value.trim();
        studentNickname = document.getElementById('student-nickname').value.trim();

        if (!studentId || !studentNickname) {
            alert('학번과 별명을 올바르게 입력해주세요!');
            return;
        }

        startQuiz();
    }

    function startQuiz() {
        currentIdx = 0;
        score = 0;
        combo = 0;
        answered = false;

        startScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');

        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        const q = quizData[currentIdx];

        badge.textContent = q.section;
        scoreDisplay.textContent = `점수: ${score}점`;
        progressBar.style.width = `${((currentIdx) / quizData.length) * 100}%`;
        questionTitle.textContent = q.question;

        explanationCard.classList.add('hidden');
        nextBtn.classList.add('hidden');
        mascotAvatar.textContent = '🤖';
        mascotSpeech.textContent = `문제 ${currentIdx + 1}/${quizData.length} : 신중하게 골라보세요!`;

        optionsList.innerHTML = '';
        q.options.forEach((optText, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-button';
            btn.textContent = optText;
            btn.onclick = () => selectOption(i);
            optionsList.appendChild(btn);
        });
    }

    function selectOption(selectedIdx) {
        if (answered) return;
        answered = true;

        const q = quizData[currentIdx];
        const buttons = optionsList.getElementsByClassName('option-button');

        for (let btn of buttons) {
            btn.disabled = true;
        }

        if (selectedIdx === q.answer) {
            buttons[selectedIdx].classList.add('correct');
            mainCard.classList.add('correct-animation');
            setTimeout(() => mainCard.classList.remove('correct-animation'), 400);

            combo++;
            let earnedScore = 10;
            if (combo >= 2) {
                earnedScore += 5;
                showComboBadge(`${combo}연속 정답! +15점`);
                playSound('combo');
            } else {
                playSound('correct');
            }

            score += earnedScore;
            scoreDisplay.textContent = `점수: ${score}점`;

            mascotAvatar.textContent = '🎉';
            mascotSpeech.textContent = combo >= 2 ? `대단해요! ${combo}연속 정답입니다!` : '정답입니다! 아주 잘하셨어요!';
        } else {
            buttons[selectedIdx].classList.add('wrong');
            buttons[q.answer].classList.add('correct');

            mainCard.classList.add('shake-animation');
            setTimeout(() => mainCard.classList.remove('shake-animation'), 500);

            combo = 0;
            hideComboBadge();
            playSound('wrong');

            mascotAvatar.textContent = '😅';
            mascotSpeech.textContent = '아쉽네요! 아래 해설을 확인해 보세요.';
        }

        explanationBody.textContent = q.explanation;
        explanationCard.classList.remove('hidden');

        if (currentIdx === quizData.length - 1) {
            nextBtn.textContent = '최종 결과 및 순위 저장 🏆';
        } else {
            nextBtn.textContent = '다음 문제로 ➔';
        }
        nextBtn.classList.remove('hidden');
    }

    function showComboBadge(text) {
        comboBadge.textContent = `🔥 ${text}`;
        comboBadge.style.display = 'block';
    }

    function hideComboBadge() {
        comboBadge.style.display = 'none';
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    async function showResult() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        hideComboBadge();

        document.getElementById('player-info').textContent = `학번: ${studentId} | 별명: ${studentNickname}`;
        document.getElementById('final-score').textContent = `${score}점`;

        const resultComment = document.getElementById('result-comment');
        if (score >= 220) {
            resultComment.innerHTML = '🏆 <b>전교 AI 마스터!</b><br>완벽에 가까운 실력입니다. AI중점고의 최고의 인재!';
        } else if (score >= 160) {
            resultComment.innerHTML = '🌟 <b>AI 브레인!</b><br>AI 트렌드와 핵심 지식이 아주 풍부하시네요!';
        } else if (score >= 100) {
            resultComment.innerHTML = '👍 <b>Good!</b><br>기본 개념이 탄탄합니다. 조금만 더 분발해 볼까요?';
        } else {
            resultComment.innerHTML = '🌱 <b>AI 입문자!</b><br>다시 도전해서 상식을 넓혀보세요!';
        }

        const savingStatus = document.getElementById('saving-status');
        savingStatus.classList.remove('hidden');

        try {
            if (!window.saveScoreToCloud) throw new Error('저장 기능을 불러오지 못했습니다.');
            await window.saveScoreToCloud(studentId, studentNickname, score);
            savingStatus.textContent = '✅ 순위표에 저장되었습니다!';
            savingStatus.classList.remove('text-red-600');
        } catch (err) {
            console.error(err);
            savingStatus.textContent = '⚠️ 저장 실패: Supabase 익명 로그인 및 인터넷 연결을 확인해주세요.';
            savingStatus.classList.add('text-red-600');
        }
    }

    function restartQuiz() {
        resultScreen.classList.add('hidden');
        startScreen.classList.remove('hidden');
    }

    async function showLeaderboardModal() {
        const modal = document.getElementById('leaderboard-modal');
        const listEl = document.getElementById('leaderboard-list');
        modal.classList.remove('hidden');

        listEl.innerHTML = `
            <div class="text-center py-8 text-slate-400 font-bold">
                <i class="fa-solid fa-circle-notch animate-spin text-3xl mb-2 text-blue-500"></i>
                <p>전교 순위를 불러오는 중입니다...</p>
            </div>
        `;

        if (window.watchLeaderboard) {
            await window.watchLeaderboard((records) => {

            if (!records || records.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-8 text-slate-400 font-bold">
                        <i class="fa-solid fa-trophy text-3xl mb-2 text-slate-300"></i>
                        <p>아직 등록된 랭킹 기록이 없습니다.<br>첫 번째 도전자가 되어보세요!</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = '';
            records.forEach((rec, rank) => {
                const item = document.createElement('div');
                let rankBadgeClass = 'bg-slate-100 text-slate-600';
                let rankIcon = `${rank + 1}`;

                if (rank === 0) {
                    rankBadgeClass = 'bg-amber-100 text-amber-700 border border-amber-300 font-black';
                    rankIcon = '🥇 1등';
                } else if (rank === 1) {
                    rankBadgeClass = 'bg-slate-200 text-slate-700 border border-slate-300 font-black';
                    rankIcon = '🥈 2등';
                } else if (rank === 2) {
                    rankBadgeClass = 'bg-amber-700/10 text-amber-800 border border-amber-600/30 font-black';
                    rankIcon = '🥉 3등';
                }

                item.className = 'flex items-center justify-between p-3.5 bg-slate-50 hover:bg-indigo-50/50 rounded-2xl border border-slate-200 transition-all';
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="px-3 py-1 rounded-xl text-xs ${rankBadgeClass}">
                            ${rankIcon}
                        </span>
                        <div>
                            <div class="text-sm font-black text-slate-800">${escapeHtml(rec.nickname)}</div>
                            <div class="text-xs font-bold text-slate-400">AI 퀴즈 참가자</div>
                        </div>
                    </div>
                    <div class="text-lg font-black text-blue-600">${rec.score}점</div>
                `;
                listEl.appendChild(item);
            });
            }, (message) => {
                listEl.textContent = message;
                listEl.className = 'text-center text-red-600 font-bold py-8';
            });
        }
    }

    function hideLeaderboardModal() {
        document.getElementById('leaderboard-modal').classList.add('hidden');
        if (window.stopLeaderboardWatch) window.stopLeaderboardWatch();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    window.handleStartQuiz = handleStartQuiz;
    window.nextQuestion = nextQuestion;
    window.restartQuiz = restartQuiz;
    window.showLeaderboardModal = showLeaderboardModal;
    window.hideLeaderboardModal = hideLeaderboardModal;
</script>
