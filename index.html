<!-- Supabase 연결 및 순위표 관리 -->
<script type="module">
import {createClient} from
  "https://esm.sh/@supabase/supabase-js@2.75.0";

const supabase = createClient(
  "https://hgfsgeeppaywanjegglj.supabase.co",
  "sb_publishable_EHs4d1xTTAOyVpK5ggyuwA_UE-hL5Sg"
);

let sessionPromise = null;

async function getPlayer(){
  if(!sessionPromise){
    sessionPromise = (async()=>{
      const {data:current,error:sessionError} =
        await supabase.auth.getSession();

      if(sessionError) throw sessionError;
      if(current.session?.user) return current.session.user;

      const {data,error} =
        await supabase.auth.signInAnonymously();

      if(error) throw error;
      if(!data.user) throw new Error("참가자 연결 실패");

      return data.user;
    })().catch(err=>{
      sessionPromise = null;
      throw err;
    });
  }
  return sessionPromise;
}

// 학생 점수 저장
window.saveCloudScore = async(nickname,score)=>{
  const user = await getPlayer();

  const {data:old,error:readError} = await supabase
    .from("quiz_leaderboard")
    .select("score")
    .eq("user_id",user.id)
    .maybeSingle();

  if(readError) throw readError;

  // 기존 최고 점수보다 낮으면 업데이트하지 않음
  if(old && old.score >= score && old.score >= 0) return;

  const {error} = await supabase
    .from("quiz_leaderboard")
    .upsert({
      user_id:user.id,
      nickname:nickname.trim().slice(0,20),
      score:score,
      updated_at:new Date().toISOString()
    },{onConflict:"user_id"});

  if(error) throw error;
};

// 관리자 전용 전체 순위표 영구 삭제
// 비밀번호는 HTML이 아닌 Supabase 서버에서 검증
window.resetLeaderboardData = async(password)=>{
  await getPlayer();

  const {data,error} = await supabase.rpc(
    "admin_reset_quiz_leaderboard",
    {p_password:password}
  );

  if(error) throw error;

  if(typeof data !== "number"){
    throw new Error("데이터베이스 삭제 결과를 확인하지 못했습니다.");
  }

  // 해당 기기의 참가자 등록 정보 초기화
  localStorage.removeItem("ai_quiz_registered_user");

  return data;
};

let channel = null;
let refreshInterval = null;
let rankingVersion = 0;

// 순위표 실시간 연결 해제
window.stopCloudRanking = async()=>{
  rankingVersion++;

  if(refreshInterval){
    clearInterval(refreshInterval);
    refreshInterval = null;
  }

  if(channel){
    const oldChannel = channel;
    channel = null;
    await supabase.removeChannel(oldChannel);
  }
};

// 모든 기기에서 공동 순위표 조회
window.startCloudRanking = async(onData,onError)=>{
  await window.stopCloudRanking();
  const version = rankingVersion;

  async function fetchRanking(){
    if(version !== rankingVersion) return;

    const {data,error} = await supabase
      .from("quiz_leaderboard")
      .select("nickname,score,updated_at")
      .gte("score",0)
      .order("score",{ascending:false})
      .order("updated_at",{ascending:true})
      .limit(1000);

    if(version !== rankingVersion) return;

    if(error) onError(error.message);
    else onData(data||[]);
  }

  try{
    await getPlayer();
    if(version !== rankingVersion) return;

    await fetchRanking();
    if(version !== rankingVersion) return;

    channel = supabase
      .channel("ai-school-ranking-"+Math.random().toString(36).slice(2))
      .on("postgres_changes",{
        event:"*",
        schema:"public",
        table:"quiz_leaderboard"
      },()=>fetchRanking())
      .subscribe();

    // 10초마다 데이터베이스 재조회
    refreshInterval = setInterval(fetchRanking,10000);

  }catch(err){
    if(version===rankingVersion) onError(err.message);
  }
};
</script>

let currentIdx=0;
let score=0;
let combo=0;
let answered=false;
let studentId="";
let studentNickname="";

const QUESTION_TIME=40;
let timerInterval=null;
let timeLeft=QUESTION_TIME;

let leaveCount=0;
let isQuizActive=false;

const el=id=>document.getElementById(id);

// 기존 참가자 정보 유지
window.addEventListener("DOMContentLoaded",()=>{
  const savedUser=localStorage.getItem("ai_quiz_registered_user");

  if(savedUser){
    try{
      const userData=JSON.parse(savedUser);

      el("student-id").value=userData.studentId;
      el("nickname").value=userData.nickname;
      el("student-id").readOnly=true;
      el("student-id").classList.add(
        "bg-slate-100","cursor-not-allowed"
      );
    }catch(e){
      localStorage.removeItem("ai_quiz_registered_user");
    }
  }
});

// 화면 이탈 감지
document.addEventListener("visibilitychange",()=>{
  if(!isQuizActive || answered) return;

  if(document.hidden){
    leaveCount++;

    if(leaveCount===1){
      alert("⚠️ [경고] 퀴즈 진행 중 화면을 이탈하셨습니다!\n다음 이탈부터는 20점씩 감점 처리됩니다.");
    }else{
      score=Math.max(0,score-20);
      el("score").textContent=`점수: ${score}점`;

      alert(`⚠️ [부정행위 감지] 화면 이탈로 20점이 감점되었습니다! (총 이탈 횟수: ${leaveCount}회)`);
    }
  }
});

function showScreen(screen){
  ["start-screen","quiz-screen","result-screen"].forEach(id=>{
    el(id).classList.toggle("hidden",id!==screen);
  });
}

// 퀴즈 시작
el("start-form").addEventListener("submit",event=>{
  event.preventDefault();

  const inputId=el("student-id").value.trim();
  const inputNickname=el("nickname").value.trim();

  if(!inputId || !inputNickname) return;

  const savedUser=localStorage.getItem("ai_quiz_registered_user");

  if(savedUser){
    const userData=JSON.parse(savedUser);

    if(userData.studentId!==inputId ||
       userData.nickname!==inputNickname){

      alert(`⚠️ 이 기기는 이미 [학번: ${userData.studentId} / 별명: ${userData.nickname}] 계정으로 등록되어 있습니다.\n한 기기에서 다른 계정으로 참가할 수 없습니다.`);

      el("student-id").value=userData.studentId;
      el("nickname").value=userData.nickname;
      return;
    }
  }else{
    localStorage.setItem("ai_quiz_registered_user",JSON.stringify({
      studentId:inputId,
      nickname:inputNickname
    }));
  }

  studentId=inputId;
  studentNickname=inputNickname;

  currentIdx=0;
  score=0;
  combo=0;
  leaveCount=0;
  answered=false;
  isQuizActive=true;

  showScreen("quiz-screen");
  loadQuestion();
});

// 문제 타이머
function startTimer(){
  clearInterval(timerInterval);
  timeLeft=QUESTION_TIME;
  updateTimerUI();

  timerInterval=setInterval(()=>{
    timeLeft--;
    updateTimerUI();

    if(timeLeft<=0){
      clearInterval(timerInterval);
      handleTimeOut();
    }
  },1000);
}

function updateTimerUI(){
  el("timer-text").textContent=`⏱️ 남은 시간: ${timeLeft}초`;
  el("timer-bar").style.width=
    `${(timeLeft/QUESTION_TIME)*100}%`;
}

// 시간 초과
function handleTimeOut(){
  if(answered) return;

  answered=true;

  const q=quizData[currentIdx];
  const buttons=Array.from(el("options").children);

  buttons.forEach(button=>button.disabled=true);
  buttons[q.answer].classList.add("correct");

  combo=0;

  el("mascot").textContent=
    "⏰ 제한시간 초과! 정답을 보시고 해설을 확인해보세요.";

  el("explanation-text").textContent=q.explanation;
  el("explanation").classList.remove("hidden");

  el("next-btn").textContent=
    currentIdx===quizData.length-1?
    "최종 결과 및 순위 저장 🏆":"다음 문제로 ➜";

  el("next-btn").classList.remove("hidden");
}

// 문제 표시
function loadQuestion(){
  answered=false;

  const q=quizData[currentIdx];

  el("section").textContent=q.section;
  el("score").textContent=`점수: ${score}점`;

  el("progress-bar").style.width=
    `${currentIdx/quizData.length*100}%`;

  el("question").textContent=q.question;
  el("mascot").textContent=
    `🤖 문제 ${currentIdx+1}/${quizData.length} : 신중하게 골라보세요!`;

  el("explanation").classList.add("hidden");
  el("next-btn").classList.add("hidden");
  el("combo").textContent="";
  el("options").innerHTML="";

  q.options.forEach((option,index)=>{
    const button=document.createElement("button");

    button.className="option";
    button.textContent=option;
    button.onclick=()=>chooseAnswer(index);

    el("options").appendChild(button);
  });

  startTimer();
}

// 정답 선택 및 점수 계산
function chooseAnswer(index){
  if(answered) return;

  answered=true;
  clearInterval(timerInterval);

  const q=quizData[currentIdx];
  const buttons=Array.from(el("options").children);

  buttons.forEach(button=>button.disabled=true);

  if(index===q.answer){
    buttons[index].classList.add("correct");
    combo++;

    const earned=combo>=2?15:10;
    score+=earned;

    if(combo>=2){
      el("combo").textContent=
        `🔥 ${combo}연속 정답! +15점`;
    }

    el("mascot").textContent=
      combo>=2?
      `🎉 대단해요! ${combo}연속 정답입니다!`:
      "🎉 정답입니다! 아주 잘하셨어요!";

  }else{
    buttons[index].classList.add("wrong");
    buttons[q.answer].classList.add("correct");

    combo=0;

    el("mascot").textContent=
      "😅 아쉽네요! 아래 해설을 확인해 보세요.";
  }

  el("score").textContent=`점수: ${score}점`;
  el("explanation-text").textContent=q.explanation;
  el("explanation").classList.remove("hidden");

  el("next-btn").textContent=
    currentIdx===quizData.length-1?
    "최종 결과 및 순위 저장 🏆":"다음 문제로 ➜";

  el("next-btn").classList.remove("hidden");
}

function nextQuestion(){
  currentIdx++;

  if(currentIdx<quizData.length){
    loadQuestion();
  }else{
    finishQuiz();
  }
}

// 최종 결과 및 클라우드 저장
async function finishQuiz(){
  isQuizActive=false;
  clearInterval(timerInterval);

  showScreen("result-screen");

  el("progress-bar").style.width="100%";
  el("player-info").textContent=
    `학번: ${studentId} | 별명: ${studentNickname}`;

  if(leaveCount>1){
    el("warning-info").textContent=
      `⚠️ 총 화면 이탈 횟수: ${leaveCount}회 (감점 반영됨)`;
  }else{
    el("warning-info").textContent="";
  }

  el("final-score").textContent=`${score}점`;

  if(score>=220){
    el("result-comment").textContent=
      "🏆 전교 AI 마스터! 완벽에 가까운 실력입니다!";
  }else if(score>=160){
    el("result-comment").textContent=
      "🌟 AI 브레인! AI 지식이 정말 풍부하네요!";
  }else if(score>=100){
    el("result-comment").textContent=
      "👍 Good! 기본 개념이 탄탄합니다!";
  }else{
    el("result-comment").textContent=
      "🌱 AI 입문자! 다시 도전해 보세요!";
  }

  el("saving-status").textContent=
    "⏳ 순위표에 저장하는 중...";

  try{
    if(!window.saveCloudScore){
      throw new Error("연결 준비 실패");
    }

    await window.saveCloudScore(studentNickname,score);

    el("saving-status").textContent=
      "✅ 점수가 공동 순위표에 저장되었습니다!";
    el("saving-status").style.color="#059669";

  }catch(err){
    console.error(err);

    el("saving-status").textContent=
      "⚠️ 점수 저장 실패. 인터넷 연결 또는 관리자 설정을 확인해주세요.";
    el("saving-status").style.color="#dc2626";
  }
}

function restartQuiz(){
  showScreen("start-screen");
}

// 순위표 열기
async function openRanking(){
  el("ranking-modal").classList.remove("hidden");
  el("ranking-list").innerHTML="";
  el("ranking-status").textContent=
    "⏳ 전교 순위를 불러오는 중...";

  await refreshRanking();
}

// 최신 순위표 불러오기
async function refreshRanking(){
  if(!window.startCloudRanking){
    el("ranking-status").textContent=
      "연결 준비 중입니다. 다시 시도해주세요.";
    return;
  }

  await window.startCloudRanking(
    records=>renderRanking(records),
    message=>{
      console.error(message);
      el("ranking-status").textContent=
        "⚠️ 순위표 연결 실패. 관리자 설정을 확인해주세요.";
    }
  );
}

// 순위표 화면 렌더링
function renderRanking(records){
  const list=el("ranking-list");
  list.innerHTML="";

  el("ranking-status").textContent=
    `✅ 공동 순위표 연결됨 · 참가자 ${records.length}명`;

  if(records.length===0){
    list.innerHTML=
      '<p class="text-center text-slate-500 py-10">아직 등록된 점수가 없습니다.<br>첫 번째 도전자가 되어보세요!</p>';
    return;
  }

  records.forEach((player,index)=>{
    const item=document.createElement("div");
    item.className="rank";

    const left=document.createElement("div");
    const name=document.createElement("div");
    const subtitle=document.createElement("div");
    const points=document.createElement("div");

    name.className="rank-name";

    const medal=["🥇","🥈","🥉"][index]||`#${index+1}`;

    name.textContent=
      `${medal} ${index+1}등 · ${player.nickname}`;

    subtitle.className=
      "text-xs text-slate-400 font-bold mt-1";
    subtitle.textContent="AI 퀴즈 참가자";

    points.className="rank-score";
    points.textContent=`${player.score}점`;

    left.append(name,subtitle);
    item.append(left,points);
    list.appendChild(item);
  });
}

function closeRanking(){
  el("ranking-modal").classList.add("hidden");

  if(window.stopCloudRanking){
    window.stopCloudRanking();
  }
}

// =====================================
// 관리자 순위표 영구 초기화
// =====================================

let resetInProgress=false;

async function resetLeaderboard(){
  if(resetInProgress) return;

  const password=prompt(
    "🔑 관리자 비밀번호를 입력하세요:"
  );

  if(password===null || !password.trim()) return;

  const confirmed=confirm(
    "⚠️ 정말로 전교 명예의 전당 기록을 모두 삭제하시겠습니까?\n\n"+
    "Supabase 데이터베이스에 저장된 모든 참가자의 기존 점수가 영구 삭제됩니다.\n"+
    "모든 휴대폰에서 이전 순위가 사라집니다.\n\n"+
    "이 작업은 취소할 수 없습니다."
  );

  if(!confirmed) return;

  resetInProgress=true;

  const resetButton=el("admin-reset-btn");
  resetButton.disabled=true;
  resetButton.textContent="⏳ 삭제 중...";

  try{
    if(!window.resetLeaderboardData){
      throw new Error("초기화 기능이 아직 준비되지 않았습니다.");
    }

    el("ranking-status").textContent=
      "⏳ Supabase 데이터베이스 기록 삭제 중...";

    // 서버에서 관리자 비밀번호 확인 후 전체 DELETE
    const deletedCount=
      await window.resetLeaderboardData(password);

    // 현재 기기의 입력값도 초기화
    el("student-id").value="";
    el("nickname").value="";
    el("student-id").readOnly=false;

    el("student-id").classList.remove(
      "bg-slate-100",
      "cursor-not-allowed"
    );

    // 삭제 완료 후 서버에서 순위표 재조회
    await refreshRanking();

    alert(
      "✅ 순위표 초기화 완료!\n\n"+
      `서버에서 삭제한 기존 기록: ${deletedCount}건\n\n`+
      "다른 기기에서도 새로고침하면 빈 순위표가 표시됩니다."
    );

  }catch(err){
    console.error("관리자 초기화 실패:",err);

    el("ranking-status").textContent=
      "⚠️ 순위표 초기화 실패";

    alert(
      "❌ 데이터베이스 기록을 삭제하지 못했습니다.\n\n"+
      "관리자 비밀번호 및 서버 연결을 확인하세요.\n\n"+
      "오류: "+err.message
    );

  }finally{
    resetInProgress=false;
    resetButton.disabled=false;
    resetButton.textContent="🧹 리셋 (관리자)";
  }
}
</script>
