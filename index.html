    // Web Audio API를 활용한 효과음 재생기
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'combo') {
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

            osc.stop(audioCtx.currentTime + 0.4);

    let currentQuestionIndex = 0;
    let score = 0;
    let combo = 0;
    let answered = false;

    function startQuiz() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        currentQuestionIndex = 0;
        score = 0;
        combo = 0;
        showQuestion();
    }

    function showQuestion() {
        answered = false;
        const mainCard = document.getElementById('main-card');
        mainCard.classList.remove('shake-animation', 'correct-animation');

        const currentQuiz = quizData[currentQuestionIndex];
        
        document.getElementById('badge').innerText = currentQuiz.section;
        document.getElementById('score-display').innerText = `점수: ${score}점`;
        document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / quizData.length) * 100}%`;
        
        document.getElementById('question-title').innerText = currentQuiz.question;
        
        document.getElementById('mascot-avatar').innerText = '🤖';
        document.getElementById('mascot-speech').innerText = '신중하게 정답을 맞춰보세요!';

        const optionsContainer = document.getElementById('options-list');
        optionsContainer.innerHTML = '';
        
        currentQuiz.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.className = 'option-button';
            button.innerText = option;
            button.onclick = () => selectOption(index);
            optionsContainer.appendChild(button);
        });

        document.getElementById('explanation-card').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
    }

    function selectOption(selectedIndex) {
        if (answered) return;
        answered = true;

        const currentQuiz = quizData[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-button');
        const mainCard = document.getElementById('main-card');
        const comboBadge = document.getElementById('combo-badge');

        buttons.forEach(btn => btn.disabled = true);

        if (selectedIndex === currentQuiz.answer) {
            combo++;
            score += 5;
            buttons[selectedIndex].classList.add('correct');
            mainCard.classList.add('correct-animation');
            
            document.getElementById('mascot-avatar').innerText = '🥳';
            document.getElementById('mascot-speech').innerText = combo >= 2 ? `대단해요! ${combo}연속 정답!` : '정답입니다! 완벽해요!';

            if (combo >= 2) {
                comboBadge.innerText = `🔥 ${combo}연속 정답! 콤보 폭발!`;
                comboBadge.style.display = 'block';
                playSound('combo');
            } else {
                playSound('correct');
            }

            document.getElementById('score-display').innerText = `점수: ${score}점`;
        } else {
            combo = 0;
            comboBadge.style.display = 'none';
            buttons[selectedIndex].classList.add('wrong');
            buttons[currentQuiz.answer].classList.add('correct');
            mainCard.classList.add('shake-animation');
            
            document.getElementById('mascot-avatar').innerText = '😭';
            document.getElementById('mascot-speech').innerText = '우우우~ 삐-! 오답이에요! 삐리릭...';
            
            playSound('wrong');
        }

        document.getElementById('explanation-body').innerText = currentQuiz.explanation;
        document.getElementById('explanation-card').style.display = 'block';
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('combo-badge').style.display = 'none';
        document.getElementById('final-score').innerText = `${score} / 100점`;

        let comment = "";
        if (score === 100) comment = "🏆 완벽합니다! 당신은 AI 마스터!";
        else if (score >= 80) comment = "🎉 대단해요! AI중점고의 인재군요!";
        else if (score >= 50) comment = "👍 준수한 상식! 조금만 더 공부하면 전문가!";
        else comment = "🌱 AI와 조금 더 친해져 볼까요? 수고하셨습니다!";

        document.getElementById('result-comment').innerText = comment;
    }

    function restartQuiz() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'block';
    }
</script>
